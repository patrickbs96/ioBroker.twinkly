# Dependabot will run on day 8 of each month at 01:27 (Europe/Berlin timezone)
# Cooldown delays updating normal npm dependencies by 7 days but allows security updates to be processed immediately.
# Note: Cooldown is not supported for the github-actions ecosystem.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "27 1 8 * *"
    open-pull-requests-limit: 15

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "27 1 8 * *"
    open-pull-requests-limit: 20
    versioning-strategy: "increase"
    cooldown:
      default-days: 7
    ignore:
      # @types/node should match the minimum supported Node.js version
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # chai is pinned to 4.x by @iobroker/testing, the plugins must follow
      - dependency-name: "chai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/chai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "chai-as-promised"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/chai-as-promised"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sinon-chai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/sinon-chai"
        update-types: ["version-update:semver-major"]
      # @iobroker/eslint-config pins the major versions of these via peerDependencies
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "globals"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-jsdoc"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-unicorn"
        update-types: ["version-update:semver-major"]
